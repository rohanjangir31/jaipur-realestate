<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background Badge for High Contrast in Browser Tabs -->
  <rect width="120" height="120" rx="26" fill="#161513"/>
  
  <!-- Outer Ground Plinth -->
  <line x1="20" y1="98" x2="100" y2="98" stroke="#C86241" stroke-width="6" stroke-linecap="round"/>
  <line x1="28" y1="92" x2="92" y2="92" stroke="#E3A857" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Central Grand Arch (Stay / Haveli Sovereign Realm) -->
  <path d="M44 92V54C44 54 44 38 60 26C76 38 76 54 76 54V92" stroke="#FAF8F5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left Wing Arch (Buy / Residential Foundation) -->
