  <!-- Right Wing Arch (Invest / Commercial Capital) -->
  <path d="M76 92V66C76 66 76 54 86 46C96 54 96 66 96 92" stroke="#D4A373" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- The Suryavanshi Keystone / Golden Apex -->
